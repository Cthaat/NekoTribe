services:
  go:
    image: ${GO_APP_IMAGE:-}
    build:
      context: .
    env_file:
      - ${GO_APP_ENV_FILE:-./.env.go}
    environment:
      HOST: 0.0.0.0
      GO_BACKEND_PORT: "8080"
      STORAGE_PATH: /app/storage
      STORAGE_ROOT_DIR: /app/storage
    ports:
      - "${GO_PUBLISH_HOST:-127.0.0.1}:${GO_PUBLISH_PORT:-30006}:8080"
    volumes:
      - "${NEKO_STORAGE_SOURCE:-./storage}:/app/storage"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
