services:
  knowledge-index:
    build:
      context: .
      dockerfile: Dockerfile.knowledge-index
      target: retrieval
    env_file:
      - ${AI_INDEX_APP_ENV_FILE:-./.env.knowledge-index}
    environment:
      AI_INDEX_HOST: 0.0.0.0
      AI_INDEX_PORT: "3818"
      AI_INDEX_ACTIVE_PROFILE: /app/profiles/active.json
    ports:
      - "${AI_INDEX_PUBLISH_HOST:-127.0.0.1}:${AI_INDEX_PUBLISH_PORT:-3818}:3818"
    volumes:
      - "${AI_INDEX_PROFILE_DIR:-./.knowledge-index}:/app/profiles:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "index/cli.mjs", "health"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

  knowledge-index-updater:
    profiles: ["index-update"]
    build:
      context: .
      dockerfile: Dockerfile.knowledge-index
      target: updater
    env_file:
      - ${AI_INDEX_UPDATER_ENV_FILE:-./.env.knowledge-index-updater}
    environment:
      AI_INDEX_ACTIVE_PROFILE: /app/profiles/active.json
    volumes:
      - "${AI_INDEX_PROFILE_DIR:-./.knowledge-index}:/app/profiles"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 60s
    restart: unless-stopped
