[package]
name = "nekotribe-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nekotribe_backend"
path = "src/lib.rs"

[[bin]]
name = "nekotribe-backend"
path = "src/main.rs"

[dependencies]
aes-gcm = "=0.10.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "=0.22.1"
bcrypt = "=0.17.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
getrandom = "=0.3.4"
hmac = "=0.12.1"
http = "1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
oracle = { version = "0.6.3", features = ["chrono"] }
redis = { version = "1.2.1", features = ["tokio-rustls-comp", "connection-manager"] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "=0.10.6"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "set-header", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
ryu-js = "=1.0.3"
multer = "3"
tempfile = "3"
infer = "0.19"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
cap-std = "3"
same-file = "1.0.6"
imagesize = { version = "0.14", default-features = false, features = ["gif", "heif", "jpeg", "png", "webp"] }

[dev-dependencies]
dotenvy = "0.15"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
