[package]
name = "nekotribe-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nekotribe_backend"
path = "src/lib.rs"

[[bin]]
name = "nekotribe-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
http = "1"
oracle = { version = "0.6.3", features = ["chrono"] }
redis = { version = "1.2.1", features = ["tokio-comp", "connection-manager"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "set-header", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
dotenvy = "0.15"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
