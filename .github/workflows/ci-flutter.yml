name: Flutter CI
on:
  push:
    branches:
      - Flutter
  pull_request:
    branches:
      - Flutter
concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nuxt: ${{ steps.heads.outputs.nuxt }}
      go: ${{ steps.heads.outputs.go }}
      rust: ${{ steps.heads.outputs.rust }}
      flutter: ${{ steps.heads.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          path: nuxt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/codex/go
          path: go
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/Rust
          path: rust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: flutter
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all four checkouts
        working-directory: nuxt
        run: |
          # Reproduce the exact source bytes recorded by the accepted RC8 receipt.
          python -c 'from pathlib import Path; p = Path("server/middleware/rate-limit.ts"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n"))'
          node scripts/contracts.mjs check --workspace-root ..
          node scripts/parity.mjs check --workspace-root ..
      - name: Record checked commits
        id: heads
        run: |
          for target in nuxt go rust flutter; do
            sha=$(git -C "$target" rev-parse HEAD)
            echo "$target=$sha" >> "$GITHUB_OUTPUT"
          done
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: flutter-web
      VERSION: latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Name target package
        id: package
        run: |
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            Windows) os=windows ;;
            *) exit 1 ;;
          esac
          case "$TARGET" in
            nuxt) stem="nuxt-node-$os-x64" ;;
            go|rust) stem="native-$TARGET-$os-x64" ;;
            flutter-web) stem=flutter-web ;;
            flutter-windows) stem=flutter-windows-x64 ;;
            *) echo "::error::Unsupported package target"; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then exit 1; fi
          echo "name=$stem-$VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_DIR=.ci-package/$stem-$VERSION" >> "$GITHUB_ENV"
          mkdir .ci-package dist
      - name: Build and verify Flutter Web
        run: |
          flutter pub get
          flutter build web --release
          node scripts/package-web.mjs build/web --out "$PACKAGE_DIR"
          node "$PACKAGE_DIR/configure-web.mjs" "$PACKAGE_DIR/site" --check
      - name: Archive package and compute SHA-256
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from shutil import make_archive
          from zipfile import ZipFile

          name = os.environ["PACKAGE_NAME"]
          archive = Path(make_archive(f"dist/{name}", "zip", root_dir=".ci-package", base_dir=name))
          with ZipFile(archive) as zipped:
              damaged = zipped.testzip()
              if damaged:
                  raise RuntimeError(f"Invalid ZIP member: {damaged}")
          with archive.open("rb") as contents:
              digest = hashlib.file_digest(contents, "sha256").hexdigest()
          archive.with_suffix(".zip.sha256").write_text(f"{digest}  {archive.name}\n", encoding="ascii", newline="\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error
    needs: contracts
    if: github.event_name == 'push'
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: flutter-windows
      VERSION: latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Name target package
        id: package
        run: |
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            Windows) os=windows ;;
            *) exit 1 ;;
          esac
          case "$TARGET" in
            nuxt) stem="nuxt-node-$os-x64" ;;
            go|rust) stem="native-$TARGET-$os-x64" ;;
            flutter-web) stem=flutter-web ;;
            flutter-windows) stem=flutter-windows-x64 ;;
            *) echo "::error::Unsupported package target"; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then exit 1; fi
          echo "name=$stem-$VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_DIR=.ci-package/$stem-$VERSION" >> "$GITHUB_ENV"
          mkdir .ci-package dist
      - name: Build Flutter Windows
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          bundle=build/windows/x64/runner/Release
          test -f "$bundle/nekotribe.exe"
          test -f "$bundle/flutter_windows.dll"
          test -f "$bundle/data/flutter_assets/AssetManifest.bin"
          mv "$bundle" "$PACKAGE_DIR"
      - name: Archive package and compute SHA-256
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from shutil import make_archive
          from zipfile import ZipFile

          name = os.environ["PACKAGE_NAME"]
          archive = Path(make_archive(f"dist/{name}", "zip", root_dir=".ci-package", base_dir=name))
          with ZipFile(archive) as zipped:
              damaged = zipped.testzip()
              if damaged:
                  raise RuntimeError(f"Invalid ZIP member: {damaged}")
          with archive.open("rb") as contents:
              digest = hashlib.file_digest(contents, "sha256").hexdigest()
          archive.with_suffix(".zip.sha256").write_text(f"{digest}  {archive.name}\n", encoding="ascii", newline="\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error
    needs: contracts
    if: github.event_name == 'push'
  rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flutter-*-latest
          merge-multiple: true
          path: dist
      - name: Verify download and record checksums
        working-directory: dist
        env:
          PREFIX: flutter
        run: |
          shopt -s nullglob
          archives=("$PREFIX"-*-latest.zip)
          expected=2
          # Publish the web archive even if Windows was unavailable.
          if [[ "$PREFIX" == flutter ]]; then
            expected=1
            test -f flutter-web-latest.zip
          fi
          test "${#archives[@]}" -ge "$expected"
          {
            echo '### 持续构建产物'
            echo
            echo '| 文件 | 大小（字节） | SHA-256 |'
            echo '| --- | ---: | --- |'
            for archive in "${archives[@]}"; do
              read -r digest filename < "$archive.sha256"
              filename="${filename%$'\r'}"
              test "$filename" = "$archive"
              printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status --strict -
              printf '| %s | %s | %s |\n' "$archive" "$(stat -c %s "$archive")" "$digest"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=rolling-latest
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target master \
              --title 'NekoTribe rolling-latest' --prerelease --latest=false \
              --notes '由四个分支的 GitHub Actions 更新。每个包均附 SHA-256。' --draft=false; then
              # Another branch can create the shared release at the same time.
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-latest
          name: NekoTribe rolling-latest
          prerelease: true
          make_latest: false
          target_commitish: master
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: read
    needs:
      - check
      - web
      - windows
    if: ${{ !cancelled() && github.event_name == 'push' && needs.check.result == 'success' && needs.web.result == 'success' }}
