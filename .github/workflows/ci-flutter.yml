name: Flutter CI
on:
  push:
    branches:
      - Flutter
  pull_request:
    branches:
      - Flutter
concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nuxt: ${{ steps.heads.outputs.nuxt }}
      go: ${{ steps.heads.outputs.go }}
      rust: ${{ steps.heads.outputs.rust }}
      flutter: ${{ steps.heads.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          path: nuxt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/codex/go
          path: go
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/Rust
          path: rust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: flutter
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all four checkouts
        working-directory: nuxt
        run: |
          # Reproduce the exact source bytes recorded by the accepted RC8 receipt.
          python -c 'from pathlib import Path; p = Path("server/middleware/rate-limit.ts"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n"))'
          node scripts/contracts.mjs check --workspace-root ..
          node scripts/parity.mjs check --workspace-root ..
      - name: Record checked commits
        id: heads
        run: |
          for target in nuxt go rust flutter; do
            sha=$(git -C "$target" rev-parse HEAD)
            echo "$target=$sha" >> "$GITHUB_OUTPUT"
          done
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check, contracts]
    if: github.event_name == 'push'
    env:
      PACKAGE_DIR: .ci-package/flutter-web-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Build and verify Flutter Web
        run: |
          flutter pub get
          flutter build web --no-pub --no-web-resources-cdn --pwa-strategy=none
          mkdir .ci-package
          node scripts/package-web.mjs build/web --out "$PACKAGE_DIR"
          node "$PACKAGE_DIR/configure-web.mjs" "$PACKAGE_DIR/site" --check
          test -s "$PACKAGE_DIR/nginx.conf.example"
      - name: Archive package and compute SHA-256
        run: python scripts/release/archive-package.py "$PACKAGE_DIR" dist
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-latest
          path: dist/
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [check, contracts]
    if: github.event_name == 'push'
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_DIR: .ci-package/flutter-windows-x64-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Build Flutter Windows and compile the installer
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --no-pub
          mkdir .ci-package
          node scripts/package-windows.mjs --version latest --out "$PACKAGE_DIR" --require-installer
      - name: Smoke-test the Windows installer
        shell: pwsh
        run: |
          $setup = Join-Path $env:PACKAGE_DIR 'NekoTribe-latest-windows-x64-setup.exe'
          $installed = Join-Path $env:RUNNER_TEMP 'nekotribe-install-smoke'
          $result = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installed`"") -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $installed 'nekotribe.exe') -PathType Leaf)) {
            throw "The Windows installer smoke test failed (exit code $($result.ExitCode))."
          }
      - name: Archive package and compute SHA-256
        run: python scripts/release/archive-package.py "$PACKAGE_DIR" dist
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-windows-x64-latest
          path: dist/
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check, contracts]
    if: github.event_name == 'push'
    env:
      PACKAGE_DIR: .ci-package/flutter-android-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the NDK required by Flutter
        run: |
          if [[ ! -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties" ]]; then
            JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Build the signed Flutter Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            umask 077
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nekotribe-release.jks"
            trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            unset ANDROID_KEYSTORE_BASE64
          fi
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get
          flutter build apk --release --no-pub
      - name: Verify APK signature and package the artifact
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          mkdir .ci-package
          node scripts/package-android.mjs --version latest --out "$PACKAGE_DIR"
      - name: Archive package and compute SHA-256
        run: python scripts/release/archive-package.py "$PACKAGE_DIR" dist
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-android-latest
          path: dist/
          if-no-files-found: error
  rolling:
    needs: [web, windows, android]
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
    uses: Cthaat/NekoTribe/.github/workflows/publish-rolling.yml@master
    with:
      stack: flutter
