name: Nuxt CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  packages: write
  actions: read
jobs:
  check:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: nuxt
    steps:
      - uses: actions/checkout@v4
        with:
          path: nuxt
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.contracts.outputs.go != ''
        with:
          path: go
          ref: ${{ needs.contracts.outputs.go }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.contracts.outputs.rust != ''
        with:
          path: rust
          ref: ${{ needs.contracts.outputs.rust }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.contracts.outputs.flutter != ''
        with:
          path: flutter
          ref: ${{ needs.contracts.outputs.flutter }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: nuxt/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Check contract sources
        run: |
          # The accepted RC8 source receipt hashes this file with Windows line endings.
          python -c 'from pathlib import Path; p = Path("server/middleware/rate-limit.ts"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n"))'
          yarn contracts:check
      - name: Verify parity receipts with their source checkouts
        if: needs.contracts.outputs.nuxt != ''
        run: yarn parity:check --workspace-root ..
      - name: Check schema, public terms and types
        run: |
          yarn schema-catalog:check
          yarn ai-terms:check
          yarn typecheck --dotenv .env.example
      - name: Run core Node tests
        run: >
          node --experimental-strip-types --test
          tests/ai-moderation-advice.test.mjs
          tests/moderation-reports-sql.test.mjs
          tests/moderation-appeals-sql.test.mjs
          tests/posts-compatibility.test.mjs
          tests/posts-creation-transaction.test.mjs
  contracts:
    permissions:
      contents: read
    uses: ./.github/workflows/contracts.yml
    with:
      nuxt-ref: ${{ github.sha }}
      go-ref: refs/heads/codex/go
      rust-ref: refs/heads/Rust
      flutter-ref: refs/heads/Flutter
      allow-missing: true
  package:
    if: github.event_name == 'push'
    needs: [check, contracts]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/package.yml
    with:
      target: nuxt
      runner: ${{ matrix.runner }}
      ref: ${{ github.sha }}
  image:
    if: github.event_name == 'push'
    needs: [check, contracts]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      target: nuxt
      version: master
      ref: ${{ github.sha }}
      rolling: true
  rolling:
    if: github.event_name == 'push'
    needs: package
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/rolling.yml
    with:
      prefix: nuxt-node
