name: Rust CI
on:
  push:
    branches:
      - Rust
  pull_request:
    branches:
      - Rust
concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - name: Run library and route tests without live services
        run: |
          cargo test --locked --lib --test contract_test --test ai_knowledge_route_test --test ai_conversation_route_test
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nuxt: ${{ steps.heads.outputs.nuxt }}
      go: ${{ steps.heads.outputs.go }}
      rust: ${{ steps.heads.outputs.rust }}
      flutter: ${{ steps.heads.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          path: nuxt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/codex/go
          path: go
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: rust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/Flutter
          path: flutter
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all four checkouts
        working-directory: nuxt
        run: |
          # Reproduce the exact source bytes recorded by the accepted RC8 receipt.
          python -c 'from pathlib import Path; p = Path("server/middleware/rate-limit.ts"); p.write_bytes(p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n"))'
          node scripts/contracts.mjs check --workspace-root ..
          node scripts/parity.mjs check --workspace-root ..
      - name: Record checked commits
        id: heads
        run: |
          for target in nuxt go rust flutter; do
            sha=$(git -C "$target" rev-parse HEAD)
            echo "$target=$sha" >> "$GITHUB_OUTPUT"
          done
  package:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: rust
      VERSION: latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Name target package
        id: package
        run: |
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            Windows) os=windows ;;
            *) exit 1 ;;
          esac
          case "$TARGET" in
            nuxt) stem="nuxt-node-$os-x64" ;;
            go|rust) stem="native-$TARGET-$os-x64" ;;
            flutter-web) stem=flutter-web ;;
            flutter-windows) stem=flutter-windows-x64 ;;
            *) echo "::error::Unsupported package target"; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then exit 1; fi
          echo "name=$stem-$VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_DIR=.ci-package/$stem-$VERSION" >> "$GITHUB_ENV"
          mkdir .ci-package dist
      - name: Build and verify Rust
        run: |
          cargo build --locked --release --bin nekotribe-backend
          binary=target/release/nekotribe-backend
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node scripts/package-native.mjs rust --binary "$binary" --out "$PACKAGE_DIR"
          node scripts/package-native.mjs --verify "$PACKAGE_DIR"
      - name: Archive package and compute SHA-256
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from shutil import make_archive
          from zipfile import ZipFile

          name = os.environ["PACKAGE_NAME"]
          archive = Path(make_archive(f"dist/{name}", "zip", root_dir=".ci-package", base_dir=name))
          with ZipFile(archive) as zipped:
              damaged = zipped.testzip()
              if damaged:
                  raise RuntimeError(f"Invalid ZIP member: {damaged}")
          with archive.open("rb") as contents:
              digest = hashlib.file_digest(contents, "sha256").hexdigest()
          archive.with_suffix(".zip.sha256").write_text(f"{digest}  {archive.name}\n", encoding="ascii", newline="\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error
    needs:
      - check
      - contracts
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/cthaat/nekotribe-rust
          VERSION: rust
          ROLLING: "true"
        run: |
          case "$IMAGE" in
            ghcr.io/cthaat/nekotribe-nuxt|ghcr.io/cthaat/nekotribe-go|ghcr.io/cthaat/nekotribe-rust) ;;
            *) exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then exit 1; fi
          {
            echo 'images<<TAGS'
            echo "$IMAGE:$VERSION"
            if [[ "$ROLLING" == true ]]; then
              sha=$(git rev-parse --short=7 HEAD)
              echo "$IMAGE:sha-$sha"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.images }}
          cache-from: type=gha,scope=rust
          cache-to: type=gha,mode=max,scope=rust
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record registry digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.images }}
        run: |
          {
            echo '### GHCR 镜像'
            printf '\n%s\n\n' "$TAGS"
            printf '摘要：%s\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    needs:
      - check
      - contracts
    if: github.event_name == 'push'
  rolling:
    needs:
      - package
      - image
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
    uses: Cthaat/NekoTribe/.github/workflows/publish-rolling.yml@master
    with:
      stack: rust
