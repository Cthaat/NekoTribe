name: Versioned NekoTribe release
on:
  push:
    tags: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 v2.0.0 或 v2.0.0-rc9
        required: true
        type: string
      prerelease:
        description: 发布为预发行版本
        default: false
        type: boolean
      nuxt_ref:
        description: Nuxt 分支、标签或 commit SHA
        default: master
        type: string
      go_ref:
        description: Go 分支、标签或 commit SHA
        default: codex/go
        type: string
      rust_ref:
        description: Rust 分支、标签或 commit SHA
        default: Rust
        type: string
      flutter_ref:
        description: Flutter 分支、标签或 commit SHA
        default: Flutter
        type: string
concurrency:
  group: versioned-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Validate version and release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#release/}"
            prerelease=false
            if [[ "$version" == *-* ]]; then prerelease=true; fi
          else
            version="$REQUESTED_VERSION"
            prerelease="$REQUESTED_PRERELEASE"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || [[ "${#version}" -gt 128 ]]; then
            echo "::error::Use a version such as v2.0.0 or v2.0.0-rc9."
            exit 1
          fi
          {
            echo "value=$version"
            echo "tag=release/$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
  contracts:
    needs: version
    uses: ./.github/workflows/contracts.yml
    with:
      nuxt-ref: ${{ github.event_name == 'push' && github.sha || inputs.nuxt_ref }}
      go-ref: ${{ inputs.go_ref || 'refs/heads/codex/go' }}
      rust-ref: ${{ inputs.rust_ref || 'refs/heads/Rust' }}
      flutter-ref: ${{ inputs.flutter_ref || 'refs/heads/Flutter' }}
  preflight:
    needs: [version, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check version is unused and any existing tag matches Nuxt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          NUXT_SHA: ${{ needs.contracts.outputs.nuxt }}
        run: |
          # Paginated lookup distinguishes an unused tag from a GitHub API failure.
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | .tag_name')
          if grep -Fxq "$TAG" <<< "$matches"; then
            echo "::error::An archived release already exists for $TAG."
            exit 1
          fi
          existing=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [[ -n "$existing" && "$existing" != "$NUXT_SHA" ]]; then
            echo "::error::Existing tag $TAG targets another Nuxt commit."
            exit 1
          fi
  packages:
    needs: [version, contracts, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: nuxt, stack: nuxt, runner: ubuntu-latest }
          - { target: nuxt, stack: nuxt, runner: windows-latest }
          - { target: go, stack: go, runner: ubuntu-latest }
          - { target: go, stack: go, runner: windows-latest }
          - { target: rust, stack: rust, runner: ubuntu-latest }
          - { target: rust, stack: rust, runner: windows-latest }
          - { target: flutter-web, stack: flutter, runner: ubuntu-latest }
          - { target: flutter-windows, stack: flutter, runner: windows-latest }
    uses: ./.github/workflows/package.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      ref: ${{ needs.contracts.outputs[matrix.stack] }}
      version: ${{ needs.version.outputs.value }}
  images:
    needs: [version, contracts, preflight]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        stack: [nuxt, go, rust]
    uses: ./.github/workflows/image.yml
    with:
      target: ${{ matrix.stack }}
      ref: ${{ needs.contracts.outputs[matrix.stack] }}
      version: ${{ needs.version.outputs.value }}
  publish:
    needs: [version, contracts, packages, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.version.outputs.value }}'
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
        with:
          path: nuxt
          ref: ${{ needs.contracts.outputs.nuxt }}
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: go
          ref: ${{ needs.contracts.outputs.go }}
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: rust
          ref: ${{ needs.contracts.outputs.rust }}
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: flutter
          ref: ${{ needs.contracts.outputs.flutter }}
          fetch-depth: 12
          persist-credentials: false
      - name: Verify eight packages and assemble the release
        shell: bash
        run: |
          {
            echo "## NekoTribe $VERSION"
            echo
            echo '### 四端对应提交与近期变更'
            for stack in nuxt go rust flutter; do
              printf '\n#### %s（%s）\n\n' "$stack" "$(git -C "$stack" rev-parse HEAD)"
              git -C "$stack" log -n 10 --pretty=format:'- %h %s%n'
            done
            echo
            echo '### 下载与校验'
            echo
            echo '合集包含四端安装包。校验文件 SHA256SUMS.txt 可用于核对单独下载的 ZIP。'
          } > release-notes.md
          {
            cat release-notes.md
            printf '\n### 容器镜像\n\n'
            for stack in nuxt go rust; do
              printf -- '- `ghcr.io/cthaat/nekotribe-%s:%s`\n' "$stack" "$VERSION"
            done
          } > publish-notes.md
          cd dist
          packages=(
            "nuxt-node-linux-x64-$VERSION.zip" "nuxt-node-windows-x64-$VERSION.zip"
            "native-go-linux-x64-$VERSION.zip" "native-go-windows-x64-$VERSION.zip"
            "native-rust-linux-x64-$VERSION.zip" "native-rust-windows-x64-$VERSION.zip"
            "flutter-web-$VERSION.zip" "flutter-windows-x64-$VERSION.zip"
          )
          for package in "${packages[@]}"; do
            sha256sum --check --status "$package.sha256"
          done
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          zip -q -0 "NekoTribe-$VERSION.zip" "${packages[@]}" SHA256SUMS.txt
          unzip -tq "NekoTribe-$VERSION.zip"
          sha256sum "NekoTribe-$VERSION.zip" > "NekoTribe-$VERSION.zip.sha256"
          cat ../publish-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.contracts.outputs.nuxt }}
          name: NekoTribe ${{ needs.version.outputs.value }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          body_path: publish-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/SHA256SUMS.txt
