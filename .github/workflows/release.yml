name: Release All Stacks
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 v2.0.0 或 v2.0.0-rc9
        required: true
        type: string
      prerelease:
        description: 发布为预发行版本
        default: false
        type: boolean
      REQUIRE_ANDROID_RELEASE_SIGNING:
        description: Require a non-debug Android signing certificate
        default: false
        type: boolean
      nuxt_ref:
        description: Nuxt 分支、标签或 commit SHA
        default: master
        type: string
      go_ref:
        description: Go 分支、标签或 commit SHA
        default: codex/go
        type: string
      rust_ref:
        description: Rust 分支、标签或 commit SHA
        default: Rust
        type: string
      flutter_ref:
        description: Flutter 分支、标签或 commit SHA
        default: Flutter
        type: string
concurrency:
  group: versioned-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  automation:
    uses: ./.github/workflows/automation-checks.yml
  version:
    needs: automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Validate version and release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="$GITHUB_REF_NAME"
            prerelease=false
          else
            version="$REQUESTED_VERSION"
            prerelease="$REQUESTED_PRERELEASE"
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][A-Za-z0-9-]*)'
          if [[ ! "$version" =~ ^v$number\.$number\.$number(-$identifier(\.$identifier)*)?$ ]] || [[ "${#version}" -gt 128 ]]; then
            echo "::error::Use a version such as v2.0.0 or v2.0.0-rc9."
            exit 1
          fi
          {
            echo "value=$version"
            echo "tag=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      nuxt: ${{ steps.heads.outputs.nuxt }}
      go: ${{ steps.heads.outputs.go }}
      rust: ${{ steps.heads.outputs.rust }}
      flutter: ${{ steps.heads.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.nuxt_ref }}
          path: nuxt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.go_ref || 'refs/heads/codex/go' }}
          path: go
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rust_ref || 'refs/heads/Rust' }}
          path: rust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.flutter_ref || 'refs/heads/Flutter' }}
          path: flutter
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify all four checkouts
        working-directory: nuxt
        run: |
          node scripts/contracts.mjs check --workspace-root ..
          node scripts/parity.mjs check --workspace-root ..
      - name: Record checked commits
        id: heads
        run: |
          for target in nuxt go rust flutter; do
            sha=$(git -C "$target" rev-parse HEAD)
            echo "$target=$sha" >> "$GITHUB_OUTPUT"
          done
    needs: version
  preflight:
    needs:
      - version
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check release and tag ownership
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          NUXT_SHA: ${{ needs.contracts.outputs.nuxt }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s --arg tag "$TAG" 'add | map(select(.tag_name == $tag))' > matching-releases.json
          if ! jq -e --arg sha "$NUXT_SHA" --arg tag "$TAG" '
            length <= 1 and all(.[]; .draft and .target_commitish == $sha and
              all(.assets[]; .name == "SHA256SUMS.txt" or
                (.name as $asset |
                  ["nuxt.zip", "go.zip", "rust.zip", "flutter.zip", "android.apk", "windows-x64-setup.exe"] |
                  any(.[]; $asset == ("NekoTribe-" + $tag + "-" + .)))))
          ' matching-releases.json >/dev/null; then
            echo "::error::A published release or unrelated draft already exists for $TAG."
            exit 1
          fi
          existing=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [[ -n "$existing" && "$existing" != "$NUXT_SHA" ]]; then
            echo "::error::Existing tag $TAG targets another Nuxt commit."
            exit 1
          fi
  packages:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contracts.outputs[matrix.stack] }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ matrix.target == 'nuxt' && 'yarn' || '' }}
      - name: Enable Yarn Classic via Corepack
        if: matrix.target == 'nuxt'
        run: corepack enable
      - uses: actions/setup-go@v5
        if: matrix.target == 'go'
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@master
        if: matrix.target == 'rust'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: matrix.target == 'rust'
      - uses: subosito/flutter-action@v2
        if: startsWith(matrix.target, 'flutter-')
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Install Flutter's Android NDK
        if: matrix.target == 'flutter-android'
        run: |
          ndk=28.2.13676358
          if [[ ! -f "$ANDROID_HOME/ndk/$ndk/source.properties" ]]; then
            JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          fi
      - uses: actions/setup-java@v4
        if: matrix.target == 'flutter-android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Name target package
        id: package
        run: |
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            Windows) os=windows ;;
            *) exit 1 ;;
          esac
          case "$TARGET" in
            nuxt) stem="nuxt-node-$os-x64" ;;
            go|rust) stem="native-$TARGET-$os-x64" ;;
            flutter-web) stem=flutter-web ;;
            flutter-windows) stem=flutter-windows-x64 ;;
            flutter-android) stem=flutter-android ;;
            *) echo "::error::Unsupported package target"; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then exit 1; fi
          echo "name=$stem-$VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_DIR=.ci-package/$stem-$VERSION" >> "$GITHUB_ENV"
          mkdir .ci-package dist
      - name: Build and verify Nuxt
        if: matrix.target == 'nuxt'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEKO_NUXT_BUILD_HEAP_MB: "6144"
          NUXT_DISABLE_SOURCEMAP: "1"
        run: |
          yarn install --frozen-lockfile
          node scripts/package-nuxt.mjs --out "$PACKAGE_DIR"
          node scripts/package-nuxt.mjs --verify "$PACKAGE_DIR"
      - name: Build and verify Go
        if: matrix.target == 'go'
        env:
          CGO_ENABLED: "0"
        run: |
          node scripts/package-native.mjs go --build --out "$PACKAGE_DIR"
          node scripts/package-native.mjs --verify "$PACKAGE_DIR"
      - name: Build and verify Rust
        if: matrix.target == 'rust'
        run: |
          cargo build --locked --release --bin nekotribe-backend
          binary=target/release/nekotribe-backend
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node scripts/package-native.mjs rust --binary "$binary" --out "$PACKAGE_DIR"
          node scripts/package-native.mjs --verify "$PACKAGE_DIR"
      - name: Build and verify Flutter Web
        if: matrix.target == 'flutter-web'
        run: |
          flutter pub get
          flutter build web --no-pub --no-web-resources-cdn --pwa-strategy=none
          node scripts/package-web.mjs build/web --out "$PACKAGE_DIR"
          node "$PACKAGE_DIR/configure-web.mjs" "$PACKAGE_DIR/site" --check
      - name: Build Flutter Windows and compile installer
        if: matrix.target == 'flutter-windows'
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          build_name="${VERSION#v}"
          flutter build windows --release --no-pub --build-name "${build_name%%-*}"
          node scripts/package-windows.mjs --version "$VERSION" --out "$PACKAGE_DIR" --require-installer
      - name: Smoke-test the Windows installer
        if: matrix.target == 'flutter-windows'
        shell: pwsh
        run: |
          $setup = Join-Path $env:PACKAGE_DIR "NekoTribe-$env:VERSION-windows-x64-setup.exe"
          $installed = Join-Path $env:RUNNER_TEMP 'nekotribe-install-smoke'
          $result = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=chinesesimplified", "/DIR=`"$installed`"") -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $installed 'nekotribe.exe') -PathType Leaf)) {
            throw "The Windows installer smoke test failed (exit code $($result.ExitCode))."
          }
      - name: Build and verify signed Flutter APK
        if: matrix.target == 'flutter-android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_ANDROID_RELEASE_SIGNING: ${{ inputs.REQUIRE_ANDROID_RELEASE_SIGNING || vars.REQUIRE_ANDROID_RELEASE_SIGNING || 'false' }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            REQUIRE_ANDROID_RELEASE_SIGNING=true
            umask 077
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nekotribe-release.jks"
            trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            warning='Android release keystore is missing. The Android build will use debug signing. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub Secrets.'
            echo "::warning::$warning"
            printf '### ⚠️ Android release signing\n\n%s\n' "$warning" >> "$GITHUB_STEP_SUMMARY"
          fi
          unset ANDROID_KEYSTORE_BASE64
          build_name="${VERSION#v}"
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get
          flutter build apk --release --no-pub --target-platform android-arm64 --build-name "${build_name%%-*}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk-certs.txt"
          cat "$RUNNER_TEMP/apk-certs.txt"
          if [[ "$REQUIRE_ANDROID_RELEASE_SIGNING" == true ]]; then
            if ! grep -Eq '^Signer #[0-9]+ certificate DN: .+' "$RUNNER_TEMP/apk-certs.txt" ||
               grep -Ei '^Signer #[0-9]+ certificate DN:.*CN[[:space:]]*=[[:space:]]*Android Debug([[:space:]]*[,;+]|[[:space:]]*$)' "$RUNNER_TEMP/apk-certs.txt"; then
              echo "::error::Android release signing requires an identifiable non-debug signer."
              exit 1
            fi
          fi
          node scripts/package-android.mjs --version "$VERSION" --out "$PACKAGE_DIR"
      - name: Archive package and compute SHA-256
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from shutil import make_archive
          from zipfile import ZipFile

          name = os.environ["PACKAGE_NAME"]
          archive = Path(make_archive(f"dist/{name}", "zip", root_dir=".ci-package", base_dir=name))
          with ZipFile(archive) as zipped:
              damaged = zipped.testzip()
              if damaged:
                  raise RuntimeError(f"Invalid ZIP member: {damaged}")
          with archive.open("rb") as contents:
              digest = hashlib.file_digest(contents, "sha256").hexdigest()
          archive.with_suffix(".zip.sha256").write_text(f"{digest}  {archive.name}\n", encoding="ascii", newline="\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error
    needs:
      - version
      - contracts
      - preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nuxt
            stack: nuxt
            runner: ubuntu-latest
          - target: nuxt
            stack: nuxt
            runner: windows-latest
          - target: go
            stack: go
            runner: ubuntu-latest
          - target: go
            stack: go
            runner: windows-latest
          - target: rust
            stack: rust
            runner: ubuntu-latest
          - target: rust
            stack: rust
            runner: windows-latest
          - target: flutter-web
            stack: flutter
            runner: ubuntu-latest
          - target: flutter-windows
            stack: flutter
            runner: windows-latest
          - target: flutter-android
            stack: flutter
            runner: ubuntu-latest
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contracts.outputs[matrix.stack] }}
          persist-credentials: false
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/cthaat/nekotribe-${{ matrix.stack }}
          VERSION: ${{ needs.version.outputs.value }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          case "$IMAGE" in
            ghcr.io/cthaat/nekotribe-nuxt|ghcr.io/cthaat/nekotribe-go|ghcr.io/cthaat/nekotribe-rust) ;;
            *) exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then exit 1; fi
          {
            echo 'images<<TAGS'
            echo "$IMAGE:$VERSION"
            if [[ "$PRERELEASE" == false ]]; then
              echo "$IMAGE:latest"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          build-args: ${{ matrix.stack == 'nuxt' && 'NODE_MAX_OLD_SPACE_SIZE=6144' || '' }}
          push: true
          tags: ${{ steps.tags.outputs.images }}
          cache-from: type=gha,scope=${{ matrix.stack }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stack }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.contracts.outputs[matrix.stack] }}
      - name: Record registry digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.images }}
        run: |
          {
            echo '### GHCR 镜像'
            printf '\n%s\n\n' "$TAGS"
            printf '摘要：%s\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    needs:
      - version
      - contracts
      - preflight
    strategy:
      fail-fast: false
      matrix:
        stack:
          - nuxt
          - go
          - rust
  publish:
    needs: [version, contracts, packages, images]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ needs.version.outputs.value }}"
          merge-multiple: true
          path: release-input
      - name: Verify nine platform artifacts and assemble four main archives
        run: |
          {
            echo '| 文件 | 大小（字节） | SHA-256 |'
            echo '| --- | ---: | --- |'
            python scripts/assemble-release.py "$VERSION" release-input release-output
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write release notes
        env:
          NUXT_SHA: ${{ needs.contracts.outputs.nuxt }}
          GO_SHA: ${{ needs.contracts.outputs.go }}
          RUST_SHA: ${{ needs.contracts.outputs.rust }}
          FLUTTER_SHA: ${{ needs.contracts.outputs.flutter }}
        run: |
          cat > release-notes.md <<EOF
          [最新正式版]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest) · [滚动版]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/rolling-latest) · [历史版本]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases)

          ## Flutter 直接下载安装

          - Android APK：[下载]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION/NekoTribe-$VERSION-android.apk)
          - Windows x64 安装器：[下载]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION/NekoTribe-$VERSION-windows-x64-setup.exe)

          ## 下载

          - **Nuxt** — \`NekoTribe-$VERSION-nuxt.zip\`，包含 Windows 和 Linux x64 全栈运行包、启动器和数据库迁移脚本。
          - **Go** — \`NekoTribe-$VERSION-go.zip\`，包含 Windows 和 Linux x64 原生后端。连接共享 Oracle 和 Redis。
          - **Rust** — \`NekoTribe-$VERSION-rust.zip\`，包含 Windows 和 Linux x64 原生后端。本机连接 Oracle 需要 Instant Client。
          - **Flutter** — \`NekoTribe-$VERSION-flutter.zip\`，包含 Windows x64 安装器和绿色版、已签名 Android APK、Web 静态站点和 Nginx 配置示例。

          ZIP 解压后按各包的 \`README.txt\` 操作。 \`SHA256SUMS.txt\` 提供四个 ZIP 和两个独立安装文件的校验值。下载全部文件后，可在 Linux 执行 \`sha256sum -c SHA256SUMS.txt\`。Windows 可用 \`Get-FileHash -Algorithm SHA256\`。

          ## 源码提交

          - Nuxt — [$NUXT_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$NUXT_SHA)
          - Go — [$GO_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GO_SHA)
          - Rust — [$RUST_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$RUST_SHA)
          - Flutter — [$FLUTTER_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$FLUTTER_SHA)

          ## Docker 镜像

          - \`ghcr.io/cthaat/nekotribe-nuxt:$VERSION\`
          - \`ghcr.io/cthaat/nekotribe-go:$VERSION\`
          - \`ghcr.io/cthaat/nekotribe-rust:$VERSION\`
          EOF
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.contracts.outputs.nuxt }}
          name: NekoTribe ${{ needs.version.outputs.value }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          make_latest: false
          draft: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-output/NekoTribe-${{ needs.version.outputs.value }}-nuxt.zip
            release-output/NekoTribe-${{ needs.version.outputs.value }}-go.zip
            release-output/NekoTribe-${{ needs.version.outputs.value }}-rust.zip
            release-output/NekoTribe-${{ needs.version.outputs.value }}-flutter.zip
            release-output/NekoTribe-${{ needs.version.outputs.value }}-android.apk
            release-output/NekoTribe-${{ needs.version.outputs.value }}-windows-x64-setup.exe
            release-output/SHA256SUMS.txt
      - name: Verify uploaded files and publish the release
        working-directory: release-output
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          MAKE_LATEST: ${{ needs.version.outputs.prerelease == 'false' }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          gh api --paginate "$endpoint/assets?per_page=100" \
            --jq '.[] | (.digest | ltrimstr("sha256:")) + "  " + .name' |
            sort -k2 > uploaded-checksums.txt
          manifest_digest=$(sha256sum -b SHA256SUMS.txt | cut -d' ' -f1)
          {
            cat SHA256SUMS.txt
            printf '%s  SHA256SUMS.txt\n' "$manifest_digest"
          } | sort -k2 > local-checksums.txt
          diff -u local-checksums.txt uploaded-checksums.txt
          gh api --method PATCH "$endpoint" -F draft=false -f make_latest="$MAKE_LATEST" --jq .html_url
