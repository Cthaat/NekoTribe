name: Publish rolling package
on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    concurrency:
      group: publish-rolling-latest
      queue: max
    permissions:
      contents: write
      actions: read
    env:
      STACK: ${{ inputs.stack }}
    steps:
      - name: Check the producing branch
        id: branch
        run: |
          case "$STACK:$GITHUB_REF" in
            nuxt:refs/heads/master) pattern=nuxt-node-*-latest ;;
            go:refs/heads/codex/go) pattern=native-go-*-latest ;;
            rust:refs/heads/Rust) pattern=native-rust-*-latest ;;
            flutter:refs/heads/Flutter) pattern=flutter-*-latest ;;
            *) echo "::error::Unexpected rolling publisher"; exit 1 ;;
          esac
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stack == 'nuxt' && github.sha || 'refs/heads/master' }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ steps.branch.outputs.pattern }}
          merge-multiple: true
          path: release-input
      - name: Assemble and verify stack archive
        run: |
          {
            echo '| 文件 | 大小（字节） | SHA-256 |'
            echo '| --- | ---: | --- |'
            python scripts/assemble-release.py latest release-input release-output --stack "$STACK"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update rolling package and refresh checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF" | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is on this branch. This archive was verified but will not be published.'
            exit 0
          fi

          tag=rolling-latest
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target master \
              --title 'NekoTribe rolling-latest' --prerelease --latest=false \
              --notes "[最新正式版]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest) · [历史版本]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases)

          四个分支各发布一个平台合集 ZIP。Flutter 的 APK 和 Windows 安装器可直接下载，SHA256SUMS.txt 提供文件校验。"
          fi
          uploads=("release-output/NekoTribe-latest-$STACK.zip")
          if [[ "$STACK" == flutter ]]; then
            uploads+=("release-output/NekoTribe-latest-android.apk"
                      "release-output/NekoTribe-latest-windows-x64-setup.exe")
          fi
          gh release upload "$tag" "${uploads[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" |
            jq -esr '
              add | map(select(.name as $name |
                ["NekoTribe-latest-nuxt.zip", "NekoTribe-latest-go.zip",
                 "NekoTribe-latest-rust.zip", "NekoTribe-latest-flutter.zip",
                 "NekoTribe-latest-android.apk", "NekoTribe-latest-windows-x64-setup.exe"] |
                index($name) != null)) |
              sort_by(.name)[] |
              if .state == "uploaded" and (.digest // "" | test("^sha256:[a-f0-9]{64}$"))
              then . else error("Invalid GitHub release asset: " + .name) end |
              "\(.digest | ltrimstr("sha256:"))  \(.name)"
            ' > release-output/SHA256SUMS.txt
          for asset in "${uploads[@]}"; do
            digest=$(sha256sum "$asset" | cut -d' ' -f1)
            grep -Fx "$digest  ${asset##*/}" release-output/SHA256SUMS.txt
          done
          gh release upload "$tag" release-output/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" | jq -j '.body // ""' |
            python scripts/rolling-release-notes.py "$STACK" "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              > "$RUNNER_TEMP/rolling-notes.md"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/rolling-notes.md"
