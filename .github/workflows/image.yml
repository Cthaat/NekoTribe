name: Publish container image
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      ref:
        type: string
        required: true
      version:
        description: Version or branch image tag
        type: string
        required: true
      rolling:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/cthaat/nekotribe-${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          ROLLING: ${{ inputs.rolling }}
        run: |
          case "$IMAGE" in
            ghcr.io/cthaat/nekotribe-nuxt|ghcr.io/cthaat/nekotribe-go|ghcr.io/cthaat/nekotribe-rust) ;;
            *) exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then exit 1; fi
          {
            echo 'images<<TAGS'
            echo "$IMAGE:$VERSION"
            if [[ "$ROLLING" == true ]]; then
              sha=$(git rev-parse --short=7 HEAD)
              echo "$IMAGE:sha-$sha"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Configure Nuxt Docker build memory
        if: inputs.target == 'nuxt'
        run: |
          sed -i 's/defineNuxtConfig({/defineNuxtConfig({\n  sourcemap: { server: false, client: false },/' nuxt.config.ts
          sed -i 's/max-old-space-size=4096/max-old-space-size=6144/g; s/^RUN yarn build$/RUN node --max-old-space-size=6144 node_modules\/nuxt\/bin\/nuxt.mjs build/' Dockerfile
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.images }}
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
      - name: Record registry digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.images }}
        run: |
          {
            echo '### GHCR 镜像'
            printf '\n%s\n\n' "$TAGS"
            printf '摘要：%s\n' "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
