# App only: Oracle/Redis are supplied by another host or an existing deployment.
services:
  app:
    image: ${NUXT_IMAGE:-nekotribe:external}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      STORAGE_PATH: /app/storage
      STORAGE_ROOT_DIR: /app/storage
      NUXT_ACCESS_SECRET: ${NUXT_ACCESS_SECRET-${ACCESS_SECRET-}}
      NUXT_ACCESS_EXPIRES_IN: ${NUXT_ACCESS_EXPIRES_IN-${ACCESS_EXPIRES_IN-900}}
      NUXT_REFRESH_SECRET: ${NUXT_REFRESH_SECRET-${REFRESH_SECRET-}}
      NUXT_REFRESH_EXPIRES_IN: ${NUXT_REFRESH_EXPIRES_IN-${REFRESH_EXPIRES_IN-2592000}}
      NUXT_COOKIE_SECURE: ${NUXT_COOKIE_SECURE-${COOKIE_SECURE-}}
      NUXT_ORACLE_HOST: ${NUXT_ORACLE_HOST-${ORACLE_HOST-}}
      NUXT_ORACLE_PORT: ${NUXT_ORACLE_PORT-${ORACLE_PORT-}}
      NUXT_ORACLE_SID: ${NUXT_ORACLE_SID-${ORACLE_SID-}}
      NUXT_ORACLE_SERVICE_NAME: ${NUXT_ORACLE_SERVICE_NAME-${ORACLE_SERVICE_NAME-}}
      NUXT_ORACLE_USER: ${NUXT_ORACLE_USER-${ORACLE_USER-}}
      NUXT_ORACLE_PASSWORD: ${NUXT_ORACLE_PASSWORD-${ORACLE_PASSWORD-}}
      NUXT_ORACLE_POOL_MIN: ${NUXT_ORACLE_POOL_MIN-${ORACLE_POOL_MIN-}}
      NUXT_ORACLE_POOL_MAX: ${NUXT_ORACLE_POOL_MAX-${ORACLE_POOL_MAX-}}
      NUXT_ORACLE_POOL_INCREMENT: ${NUXT_ORACLE_POOL_INCREMENT-${ORACLE_POOL_INCREMENT-}}
      NUXT_REDIS_URL: ${NUXT_REDIS_URL-${REDIS_URL-}}
      NUXT_REDIS_HOST: ${NUXT_REDIS_HOST-${REDIS_HOST-}}
      NUXT_REDIS_PORT: ${NUXT_REDIS_PORT-${REDIS_PORT-}}
      NEKO_CACHE_MODE: ${NEKO_CACHE_MODE:-shared}
      NUXT_REDIS_DB: ${NUXT_REDIS_DB-${REDIS_DB-}}
      NUXT_REDIS_PASSWORD: ${NUXT_REDIS_PASSWORD-${REDIS_PASSWORD-}}
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST-${SMTP_HOST-}}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT-${SMTP_PORT-}}
      NUXT_SMTP_USER: ${NUXT_SMTP_USER-${SMTP_USER-}}
      NUXT_SMTP_PASS: ${NUXT_SMTP_PASS-${SMTP_PASS-}}
      NUXT_SENTIMENT_FLOW_ENABLED: "false"
      NUXT_NLS_LANG: ${NUXT_NLS_LANG-${NLS_LANG-}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-}
      CORS_ALLOW_LOCALHOST_ORIGINS: ${CORS_ALLOW_LOCALHOST_ORIGINS-}
      TRUST_PROXY: ${TRUST_PROXY-}
      BASE_URL: ${BASE_URL-}
      STORAGE_TYPE: ${STORAGE_TYPE-}
      STORAGE_PUBLIC_BASE: ${STORAGE_PUBLIC_BASE-}
      STORAGE_CDN_BASE_URL: ${STORAGE_CDN_BASE_URL-}
      NUXT_API_SERVER_BASE: ${NUXT_API_SERVER_BASE-${API_BACKEND_UPSTREAM-}}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE-}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-${DOCKER_PUBLIC_WS_URL:-}}
      NUXT_PUBLIC_STORAGE_BASE: ${NUXT_PUBLIC_STORAGE_BASE-}
      NUXT_PUBLIC_SENTIMENT_FLOW_ENABLED: "false"
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-30001}:3000'
    volumes:
      - ${STORAGE_ROOT_DIR:-./storage}:/app/storage
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
