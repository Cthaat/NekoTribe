# Optional public entry for UI + selectable HTTP backend + Nuxt WebSocket.
# Does not start an app, Rust, a database or Redis.
services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - '${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-30005}:80'
    environment:
      UI_NUXT_UPSTREAM: ${UI_NUXT_UPSTREAM:-http://host.docker.internal:3000}
      API_BACKEND_UPSTREAM: ${API_BACKEND_UPSTREAM:-http://host.docker.internal:3000}
      NGINX_ENVSUBST_FILTER: '^(UI_NUXT_UPSTREAM|API_BACKEND_UPSTREAM)$$'
    volumes:
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
