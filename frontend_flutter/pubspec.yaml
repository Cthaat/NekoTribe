name: nekotribe
description: "NekoTribe Flutter Client - multi-platform social platform client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  http_parser: ^4.0.2

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Realtime
  web_socket_channel: ^3.0.1

  # Media
  cached_network_image: ^3.4.1
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  mime: ^1.0.6

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  window_manager: ^0.5.1

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/app_config.json
